schema_version: 1

context:
  version: "4.1"

package:
  name: zope.processlifetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zope.processlifetime/zope_processlifetime-${{ version }}.tar.gz
  sha256: 81586dc0cf2b182c5ec088a542f815c4650c65a837ef9f11800c452036d7da87

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - zope.interface

tests:
  - python:
      imports:
        - zope.processlifetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m unittest discover -v zope.processlifetime

about:
  homepage: https://github.com/zopefoundation/zope.processlifetime
  repository: https://github.com/zopefoundation/zope.processlifetime
  documentation: https://zopeprocesslifetime.readthedocs.io
  summary: Zope process lifetime events
  license: ZPL-2.1
  license_file:
    - LICENSE.txt
    - COPYRIGHT.txt

extra:
  recipe-maintainers:
    - killua156
